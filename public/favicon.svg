<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C59E5D"/>
      <stop offset="100%" stop-color="#A57F3E"/>
    </linearGradient>
  </defs>
  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="#0F1B2F" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FAF8F2" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Golden Laurel Wreath (Bottom Arc) -->
  <g fill="url(#goldGrad)" stroke="none">
    <!-- Left Laurel Leaves -->
    <path d="M19 41 C 18 38, 15 36, 13 37 C 15 39, 17 41, 19 41 Z"/>
    <path d="M22 44 C 20 41, 17 40, 16 42 C 18 43, 20 45, 22 44 Z"/>
    <path d="M26 47 C 24 45, 21 45, 20 47 C 22 48, 24 48, 26 47 Z"/>
    <path d="M30 48.5 C 28 47.5, 25 48.5, 25 50.5 C 27 50.5, 29 49.5, 30 48.5 Z"/>
    <!-- Right Laurel Leaves -->
    <path d="M45 41 C 46 38, 49 36, 51 37 C 49 39, 47 41, 45 41 Z"/>
    <path d="M42 44 C 44 41, 47 40, 48 42 C 46 43, 44 45, 42 44 Z"/>
    <path d="M38 47 C 40 45, 43 45, 44 47 C 42 48, 40 48, 38 47 Z"/>
    <path d="M34 48.5 C 36 47.5, 39 48.5, 39 50.5 C 37 50.5, 35 49.5, 34 48.5 Z"/>
  </g>

  <!-- Open Book Emblem -->
  <!-- Left Page -->
  <path d="M31 22 C 26 21, 21 21.5, 18 23.5 L 18 39 C 21 37, 26 36.5, 31 38.5 Z" 
        fill="#FAF8F2" stroke="#FAF8F2" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Page -->
  <path d="M33 22 C 38 21, 43 21.5, 46 23.5 L 46 39 C 43 37, 38 36.5, 33 38.5 Z" 
        fill="#FAF8F2" stroke="#FAF8F2" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Book spine line & inner detail -->
  <line x1="32" y1="21.5" x2="32" y2="40" stroke="#0F1B2F" stroke-width="1.5"/>
  <path d="M22 27 C 25 26, 28 26.2, 30 27" stroke="#0F1B2F" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M22 31 C 25 30, 28 30.2, 30 31" stroke="#0F1B2F" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M34 27 C 36 26.2, 39 26, 42 27" stroke="#0F1B2F" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M34 31 C 36 30.2, 39 30, 42 31" stroke="#0F1B2F" stroke-width="0.9" fill="none" stroke-linecap="round"/>
</svg>